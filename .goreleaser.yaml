# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com

# The lines below are called `modelines`. See `:help modeline`
# Feel free to remove those if you don't want/need to use them.
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

project_name: resurgo

env:
  # the node links SQLite (cgo), statically against musl through zig cc
  # (resurgo-store.md §4.1); ZIG names another zig than the one on PATH
  - CGO_ENABLED=1
#  - _GO_MK_VARS_NAME={{ .Env._GO_MK_VARS_NAME}}
#  - _GO_MK_VARS_METADATA_PACKAGE={{ .Env._GO_MK_VARS_METADATA_PACKAGE }}
before:
  hooks:
    - go mod download
    - go mod tidy
    - go generate ./...
    # the completion scripts come from the binary, so that they always match it
    - sh -c 'mkdir -p build/completions && go run ./cmd/resurgo completion bash >build/completions/resurgo && go run ./cmd/resurgo completion zsh >build/completions/_resurgo'

builds:
  - id: resurgo
    main: ./cmd/resurgo
    binary: resurgo
    # Linux only, statically linked against musl (NFR-6, resurgo-store.md §4.1)
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    # v1 runs on any x86-64 CPU; v2 and v3 are optimized variants
    goamd64:
      - v1
      - v2
      - v3
    overrides:
      - goos: linux
        goarch: amd64
        goamd64: v1
        env: ['CC={{ if index .Env "ZIG" }}{{ .Env.ZIG }}{{ else }}zig{{ end }} cc -target x86_64-linux-musl']
      - goos: linux
        goarch: amd64
        goamd64: v2
        env: ['CC={{ if index .Env "ZIG" }}{{ .Env.ZIG }}{{ else }}zig{{ end }} cc -target x86_64-linux-musl']
      - goos: linux
        goarch: amd64
        goamd64: v3
        env: ['CC={{ if index .Env "ZIG" }}{{ .Env.ZIG }}{{ else }}zig{{ end }} cc -target x86_64-linux-musl']
      - goos: linux
        goarch: arm64
        env: ['CC={{ if index .Env "ZIG" }}{{ .Env.ZIG }}{{ else }}zig{{ end }} cc -target aarch64-linux-musl']
    tags:
      - osusergo
      - netgo
      - static_build
      - sqlite_omit_load_extension
    flags:
      - -trimpath  
    ldflags:
      - -s -w 
      - -linkmode external
      - -extldflags "-static -s"
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.Name={{.ArtifactName}}' 
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.Description={{.Env._GO_MK_VARS_DESCRIPTION}}' 
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.Copyright={{.Env._GO_MK_VARS_COPYRIGHT}}' 
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.License={{.Env._GO_MK_VARS_LICENSE}}' 
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.LicenseURL={{.Env._GO_MK_VARS_LICENSE_URL}}' 
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.Version={{.Version}}' 
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.VersionMajor={{.Major}}' 
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.VersionMinor={{.Minor}}' 
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.VersionPatch={{.Patch}}' 
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.Vendor={{.Env._GO_MK_VARS_VENDOR}}' 
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.Maintainer={{.Env._GO_MK_VARS_MAINTAINER}}' 
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.DotEnvVarName={{.Env._GO_MK_VARS_DOTENV_VAR_NAME}}' 
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.BuildTime={{.Now}}' 
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.GitTag={{.Tag}}' 
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.GitCommit={{.Commit}}' 
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.GitTime={{.CommitDate}}' 
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.GitTreeState={{.GitTreeState}}' 
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.GitBranch={{.Branch}}'
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.GoReleaserVersion={{.Env._GORELEASER_VERSION}}'
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: resurgo
    ids:
      - resurgo
    formats:
      - tar.gz
    name_template: >-
      resurgo_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}{{ .Arm }}{{ end }}
      {{- if and .Amd64 (ne .Amd64 "v1") }}{{ .Amd64 }}{{ end }}
    files:
      - src: build/completions/*
        dst: completions/

upx:
  - enabled: false
    ids: [resurgo]
    goos: [linux]
    goarch: [amd64, arm64]
    goamd64: [v1, v2, v3]
    compress: "9"
    lzma: true

nfpms:
  - id: resurgo
    package_name: resurgo
    ids:
      - resurgo
    description: |
      resurgo runs a plugin (a "runnable") on the leader of a Raft cluster
      and nowhere else: when the leader changes, it stops the runnable on
      the old leader and starts it again on the new one, with a fencing
      epoch and the last checkpoint the runnable committed through Raft.
    homepage: "https://github.com/dihedron/resurgo"
    maintainer: "Andrea Funtò <dihedron.dev@gmail.com>"
    vendor: "Andrea Funtò"
    license: "MIT"
    formats:
      - rpm
      - deb
      - apk
    epoch: "1"
    release: "1"
    section: default
    priority: "optional"
    # signed with the packaging key when GPG_KEY_FILE names its armored
    # private key (passphrase in NFPM_PASSPHRASE); unsigned otherwise
    rpm:
      signature:
        key_file: '{{ if index .Env "GPG_KEY_FILE" }}{{ .Env.GPG_KEY_FILE }}{{ end }}'
    deb:
      signature:
        key_file: '{{ if index .Env "GPG_KEY_FILE" }}{{ .Env.GPG_KEY_FILE }}{{ end }}'
        type: origin
    overrides:
      deb:
        dependencies: [ca-certificates]
      rpm:
        dependencies: [ca-certificates]
    contents:
      - src: ./packaging/resurgo.service
        dst: /usr/lib/systemd/system/resurgo.service
        file_info:
          mode: 0644
      - src: ./examples/resurgo.yaml
        dst: /etc/resurgo/resurgo.yaml
        type: config|noreplace
        file_info:
          mode: 0640
          owner: root
          group: resurgo
      # the runnables' binaries (.specs/resurgo_specification.md, SEC-5)
      - dst: /usr/libexec/resurgo/runnables
        type: dir
        file_info:
          mode: 0755
          owner: root
          group: root
      - src: ./build/completions/resurgo
        dst: /usr/share/bash-completion/completions/resurgo
        file_info:
          mode: 0644
      - src: ./build/completions/_resurgo
        dst: /usr/share/zsh/site-functions/_resurgo
        file_info:
          mode: 0644
    scripts:
      preinstall: ./packaging/preinstall.sh
      postinstall: ./packaging/postinstall.sh

source:
  enabled: true
  # the archive extension is appended by goreleaser
  name_template: "{{ .ProjectName }}_{{ .Version }}_source"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
sboms:
  - cmd: syft
    documents:
      - "${artifact}.cdx.json"
    args: ["$artifact", "--output", "cyclonedx-json=$document", "-vvv"]
    artifacts: package
    disable: false
    
    
checksum:
  # the release documents too, when built (make docs): the signature of the
  # checksums file then covers them like the packages (T-11)
  extra_files:
    - glob: ./build/docs/*.pdf

# the checksums file covers every archive, package and SBOM: its detached
# signature, made with the packaging key whose fingerprint is in
# GPG_FINGERPRINT, vouches for all of them (T-11). make snapshot skips it when
# GPG_FINGERPRINT is unset; make release requires it.
signs:
  - id: checksums
    artifacts: checksum
    signature: "${artifact}.asc"
    args:
      - --batch
      - --yes
      - --local-user
      - "{{ .Env.GPG_FINGERPRINT }}"
      - --armor
      - --output
      - "${signature}"
      - --detach-sign
      - "${artifact}"

release:
  # the release documents (make docs, before make release): see
  # .specs/resurgo_specification.md (rule 12)
  extra_files:
    - glob: ./build/docs/*.pdf
  footer: |
    ---
    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
