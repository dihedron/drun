# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com

# The lines below are called `modelines`. See `:help modeline`
# Feel free to remove those if you don't want/need to use them.
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

project_name: drun

env:
  # the node links SQLite (cgo), statically against musl through zig cc
  # (drun-store.md §4.1); ZIG names another zig than the one on PATH
  - CGO_ENABLED=1
#  - _GO_MK_VARS_NAME={{ .Env._GO_MK_VARS_NAME}}
#  - _GO_MK_VARS_METADATA_PACKAGE={{ .Env._GO_MK_VARS_METADATA_PACKAGE }}
before:
  hooks:
    - go mod download
    - go mod tidy
    - go generate ./...
    # the completion scripts come from the binary, so that they always match it
    - sh -c 'mkdir -p build/completions && go run ./cmd/drun completion bash >build/completions/drun && go run ./cmd/drun completion zsh >build/completions/_drun'

builds:
  - id: drun
    main: ./cmd/drun
    binary: drun
    # Linux only, statically linked against musl (NFR-6, drun-store.md §4.1)
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    # v1 runs on any x86-64 CPU; v2 and v3 are optimized variants
    goamd64:
      - v1
      - v2
      - v3
    overrides:
      - goos: linux
        goarch: amd64
        goamd64: v1
        env: ['CC={{ if index .Env "ZIG" }}{{ .Env.ZIG }}{{ else }}zig{{ end }} cc -target x86_64-linux-musl']
      - goos: linux
        goarch: amd64
        goamd64: v2
        env: ['CC={{ if index .Env "ZIG" }}{{ .Env.ZIG }}{{ else }}zig{{ end }} cc -target x86_64-linux-musl']
      - goos: linux
        goarch: amd64
        goamd64: v3
        env: ['CC={{ if index .Env "ZIG" }}{{ .Env.ZIG }}{{ else }}zig{{ end }} cc -target x86_64-linux-musl']
      - goos: linux
        goarch: arm64
        env: ['CC={{ if index .Env "ZIG" }}{{ .Env.ZIG }}{{ else }}zig{{ end }} cc -target aarch64-linux-musl']
    tags:
      - osusergo
      - netgo
      - static_build
      - sqlite_omit_load_extension
    flags:
      - -trimpath  
    ldflags:
      - -s -w 
      - -linkmode external
      - -extldflags "-static -s"
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.Name={{.ArtifactName}}' 
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.Description={{.Env._GO_MK_VARS_DESCRIPTION}}' 
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.Copyright={{.Env._GO_MK_VARS_COPYRIGHT}}' 
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.License={{.Env._GO_MK_VARS_LICENSE}}' 
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.LicenseURL={{.Env._GO_MK_VARS_LICENSE_URL}}' 
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.Version={{.Version}}' 
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.VersionMajor={{.Major}}' 
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.VersionMinor={{.Minor}}' 
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.VersionPatch={{.Patch}}' 
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.Vendor={{.Env._GO_MK_VARS_VENDOR}}' 
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.Maintainer={{.Env._GO_MK_VARS_MAINTAINER}}' 
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.DotEnvVarName={{.Env._GO_MK_VARS_DOTENV_VAR_NAME}}' 
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.BuildTime={{.Now}}' 
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.GitTag={{.Tag}}' 
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.GitCommit={{.Commit}}' 
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.GitTime={{.CommitDate}}' 
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.GitTreeState={{.GitTreeState}}' 
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.GitBranch={{.Branch}}'
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.GoReleaserVersion={{.Env._GORELEASER_VERSION}}'
    mod_timestamp: "{{ .CommitTimestamp }}"

  # the example runnables: the SDK only, no cgo (drun-store.md §4.1)
  - id: ticker
    main: ./cmd/drun-runnable-ticker
    binary: drun-runnable-ticker
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.Version={{.Version}}'
    mod_timestamp: "{{ .CommitTimestamp }}"
    # its signed manifest (drun_specification.md §8.8): a snapshot signs with
    # a throwaway key no drun accepts
    hooks:
      post:
        - cmd: go run ./tools/runnable-manifest sign -name ticker -version {{ .Version }} -out build/runnables/{{ .Os }}_{{ .Arch }} {{ if .IsSnapshot }}-allow-unsigned{{ end }} {{ .Path }}
          output: true
  - id: fenced-counter
    main: ./cmd/drun-runnable-fenced-counter
    binary: drun-runnable-fenced-counter
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.Version={{.Version}}'
    mod_timestamp: "{{ .CommitTimestamp }}"
    # its signed manifest (drun_specification.md §8.8): a snapshot signs with
    # a throwaway key no drun accepts
    hooks:
      post:
        - cmd: go run ./tools/runnable-manifest sign -name fenced-counter -version {{ .Version }} -out build/runnables/{{ .Os }}_{{ .Arch }} {{ if .IsSnapshot }}-allow-unsigned{{ end }} {{ .Path }}
          output: true

archives:
  - id: drun
    ids:
      - drun
    formats:
      - tar.gz
    name_template: >-
      drun_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}{{ .Arm }}{{ end }}
      {{- if and .Amd64 (ne .Amd64 "v1") }}{{ .Amd64 }}{{ end }}
    files:
      - src: build/completions/*
        dst: completions/

  - id: examples
    ids: [ticker, fenced-counter]
    formats: [tar.gz]
    name_template: >-
      drun-runnable-examples_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}
    files:
      - src: "build/runnables/{{ .Os }}_{{ .Arch }}/*.manifest*"
        strip_parent: true

upx:
  - enabled: false
    ids: [drun]
    goos: [linux]
    goarch: [amd64, arm64]
    goamd64: [v1, v2, v3]
    compress: "9"
    lzma: true

nfpms:
  - id: drun
    package_name: drun
    ids:
      - drun
    description: |
      drun runs a plugin (a "runnable") on the leader of a Raft cluster
      and nowhere else: when the leader changes, it stops the runnable on
      the old leader and starts it again on the new one, with a fencing
      epoch and the last checkpoint the runnable committed through Raft.
    homepage: "https://github.com/dihedron/drun"
    maintainer: "Andrea Funtò <dihedron.dev@gmail.com>"
    vendor: "Andrea Funtò"
    license: "MIT"
    formats:
      - rpm
      - deb
      - apk
    epoch: "1"
    release: "1"
    section: default
    priority: "optional"
    # signed with the packaging key when GPG_KEY_FILE names its armored
    # private key (passphrase in NFPM_PASSPHRASE); unsigned otherwise
    rpm:
      signature:
        key_file: '{{ if index .Env "GPG_KEY_FILE" }}{{ .Env.GPG_KEY_FILE }}{{ end }}'
    deb:
      signature:
        key_file: '{{ if index .Env "GPG_KEY_FILE" }}{{ .Env.GPG_KEY_FILE }}{{ end }}'
        type: origin
    overrides:
      deb:
        dependencies: [ca-certificates]
      rpm:
        dependencies: [ca-certificates]
    contents:
      - src: ./packaging/drun.service
        dst: /usr/lib/systemd/system/drun.service
        file_info:
          mode: 0644
      - src: ./examples/drun.yaml
        dst: /etc/drun/drun.yaml
        type: config|noreplace
        file_info:
          mode: 0640
          owner: root
          group: drun
      # the runnables' binaries (.specs/drun_specification.md, SEC-5)
      - dst: /usr/libexec/drun/runnables
        type: dir
        file_info:
          mode: 0755
          owner: root
          group: root
      # the release's runnable-signing keys: a plain file, not a configuration
      # one, so that an upgrade installs the current keys (§8.8)
      - dst: /etc/drun/runnable-keys
        type: dir
        file_info:
          mode: 0755
          owner: root
          group: root
      - src: ./packaging/runnable-signing.pub
        dst: /etc/drun/runnable-keys/drun.pub
        file_info:
          mode: 0644
          owner: root
          group: root
      - src: ./build/completions/drun
        dst: /usr/share/bash-completion/completions/drun
        file_info:
          mode: 0644
      - src: ./build/completions/_drun
        dst: /usr/share/zsh/site-functions/_drun
        file_info:
          mode: 0644
    scripts:
      preinstall: ./packaging/preinstall.sh
      postinstall: ./packaging/postinstall.sh

  - id: examples
    package_name: drun-runnable-examples
    ids: [ticker, fenced-counter]
    description: |
      The example runnables of drun: drun-runnable-ticker (stateless,
      checkpoints a counter) and drun-runnable-fenced-counter (stateful,
      appends rows to PostgreSQL fenced by its epoch, with a checker).
    homepage: "https://github.com/dihedron/drun"
    maintainer: "Andrea Funtò <dihedron.dev@gmail.com>"
    vendor: "Andrea Funtò"
    license: "MIT"
    formats: [rpm, deb, apk]
    epoch: "1"
    release: "1"
    section: default
    priority: "optional"
    # root's, writable by root only (SEC-4)
    bindir: /usr/libexec/drun/runnables
    # the examples' signed manifests, next to the binaries (§8.8); they are
    # of this release only, so drun and the examples are upgraded together
    contents:
      - src: "build/runnables/{{ .Os }}_{{ .Arch }}/drun-runnable-ticker.manifest"
        dst: /usr/libexec/drun/runnables/drun-runnable-ticker.manifest
        file_info: { mode: 0644, owner: root, group: root }
      - src: "build/runnables/{{ .Os }}_{{ .Arch }}/drun-runnable-ticker.manifest.sig"
        dst: /usr/libexec/drun/runnables/drun-runnable-ticker.manifest.sig
        file_info: { mode: 0644, owner: root, group: root }
      - src: "build/runnables/{{ .Os }}_{{ .Arch }}/drun-runnable-fenced-counter.manifest"
        dst: /usr/libexec/drun/runnables/drun-runnable-fenced-counter.manifest
        file_info: { mode: 0644, owner: root, group: root }
      - src: "build/runnables/{{ .Os }}_{{ .Arch }}/drun-runnable-fenced-counter.manifest.sig"
        dst: /usr/libexec/drun/runnables/drun-runnable-fenced-counter.manifest.sig
        file_info: { mode: 0644, owner: root, group: root }
    rpm:
      signature:
        key_file: '{{ if index .Env "GPG_KEY_FILE" }}{{ .Env.GPG_KEY_FILE }}{{ end }}'
    deb:
      signature:
        key_file: '{{ if index .Env "GPG_KEY_FILE" }}{{ .Env.GPG_KEY_FILE }}{{ end }}'
        type: origin
    scripts:
      postinstall: ./packaging/examples-postinstall.sh

source:
  enabled: true
  # the archive extension is appended by goreleaser
  name_template: "{{ .ProjectName }}_{{ .Version }}_source"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
sboms:
  - cmd: syft
    documents:
      - "${artifact}.cdx.json"
    args: ["$artifact", "--output", "cyclonedx-json=$document", "-vvv"]
    artifacts: package
    disable: false
    
    
checksum:
  # the release documents too, when built (make docs): the signature of the
  # checksums file then covers them like the packages (T-11)
  extra_files:
    - glob: ./build/docs/*.pdf

# the checksums file covers every archive, package and SBOM: its detached
# signature, made with the packaging key whose fingerprint is in
# GPG_FINGERPRINT, vouches for all of them (T-11). make snapshot skips it when
# GPG_FINGERPRINT is unset; make release requires it.
signs:
  - id: checksums
    artifacts: checksum
    signature: "${artifact}.asc"
    args:
      - --batch
      - --yes
      - --local-user
      - "{{ .Env.GPG_FINGERPRINT }}"
      - --armor
      - --output
      - "${signature}"
      - --detach-sign
      - "${artifact}"

release:
  # a tag with a pre-release suffix (v0.1.0-rc.1) is published as a
  # GitHub pre-release
  prerelease: auto
  # the release documents (make docs, before make release): see
  # .specs/drun_specification.md (rule 12)
  extra_files:
    - glob: ./build/docs/*.pdf
  footer: |
    ---
    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
